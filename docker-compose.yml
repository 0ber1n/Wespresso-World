version: '3.8'

networks:
  lab:
    driver: bridge

volumes:
  ctfd-uploads:
  ctfd-logs:
  ctfd-db-data:
  ctfd-redis-data:

services:

  # ── Target application ────────────────────────────────────────────────────
  wespresso:
    image: ghcr.io/0ber1n/wespresso-world:latest
    ports:
      - "31337:80"   # everything goes through nginx now
    env_file:
      - .env
