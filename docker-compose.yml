version: '3.8'

networks:
  lab:
    driver: bridge

volumes:
  ctfd-uploads:
  ctfd-logs:
  ctfd-db-data:
  ctfd-redis-data:

services:

  # ── Target application ────────────────────────────────────────────────────
  wespresso:
    image: ghcr.io/0ber1n/wespresso-world:latest
    ports:
      - "31337:80"    # frontend
      - "1337:1337"   # backend API
    env_file:
      - .env
    networks:
      - lab
    restart: unless-stopped

  # ── CTFd platform ─────────────────────────────────────────────────────────
  ctfd:
    image: ctfd/ctfd
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${CTFD_SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=mysql+pymysql://ctfd:${CTFD_DB_PASS:-ctfd_pass}@ctfd-db/ctfd
      - REDIS_URL=redis://ctfd-redis:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=false
    volumes:
      - ctfd-uploads:/var/uploads
      - ctfd-logs:/var/log/CTFd
    depends_on:
      ctfd-db:
        condition: service_healthy
      ctfd-redis:
        condition: service_started
    networks:
      - lab

  ctfd-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${CTFD_DB_ROOT_PASS:-ctfd_root_pass}
      - MYSQL_DATABASE=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=${CTFD_DB_PASS:-ctfd_pass}
    volumes:
      - ctfd-db-data:/var/lib/mysql
    networks:
      - lab
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ctfd-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ctfd-redis-data:/data
    networks:
      - lab
