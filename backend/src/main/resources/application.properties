server.port=1337
spring.application.name=Wespresso World
server.servlet.context-path=/api/v1

# Set active profile (switch between h2 and sqlite)
spring.profiles.active=sqlite

# Show the SQL in the terminal
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# logging
logging.level.org.springframework.security=DEBUG

# JWT Key Info
jwt.secret=${JWT_SECRET:wespresso-super-secret-key-2026-ctf-challenge}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Vulnerabilities switches
vuln.jwt-none.enabled=${VULN_JWT_NONE_ENABLED:false}
vuln.ssti-thymeleaf.enabled=${VULN_SSTI_THYMELEAF_ENABLED:false}
vuln.session-fixation.enabled=${VULN_SESSION_FIXATION_ENABLED:false}
vuln.xxe.enabled=${VULN_XXE_ENABLED:false}
vuln.xxe-hard.enabled=${VULN_XXE_HARD_ENABLED:false}
vuln.mass-assignment.enabled=${VULN_MASS_ASSIGNMENT_ENABLED:false}

# Prevent FreeMarker from trying to handle Thymeleaf's routes
spring.freemarker.check-template-location=false

# Flags — override via env vars to rotate without rebuilding
flag.sqli=${FLAG_SQLI:wes{$ql1_1nj3ct10n_w1ns}}
flag.idor-cart=${FLAG_IDOR_CART:wes{1D0R_3xp0s3d_4dm1n_c4rt}}
flag.jwt-none=${FLAG_JWT_NONE:wes{n0n3_$hall_p@55}}
flag.file-upload-ext-only=${FLAG_FILE_UPLOAD_EXT_ONLY:wes{file_upload_double_extension_bypass}}
flag.file-upload-endswith=${FLAG_FILE_UPLOAD_ENDSWITH:wes{file_upload_endswith_bypass}}
flag.file-upload-magic-byte=${FLAG_FILE_UPLOAD_MAGIC_BYTE:wes{file_upload_magic_byte_bypass}}
flag.file-upload-cdr=${FLAG_FILE_UPLOAD_CDR:wes{file_upload_polyglot_cdr_bypass}}
flag.xxe=${FLAG_XXE:wes{xxe_3xt3rn4l_3nt1ty}}
flag.xxe-hard=${FLAG_XXE_HARD:wes{xxe_h4rd_c0nt3nt_typ3_sw4p}}
flag.ssti=${FLAG_SSTI:flag{th1m3l34f_ssti_pwnd}}