server.port=1337
spring.application.name=Wespresso World
server.servlet.context-path=/api/v1

# Set active profile (switch between h2 and sqlite)
spring.profiles.active=sqlite

# Show the SQL in the terminal
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# logging
logging.level.org.springframework.security=DEBUG

# JWT Key Info
jwt.secret=${JWT_SECRET:default_secret_key}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Vulnerabilities switches
vuln.jwt-none.enabled=${ENV_VULN_JWT_NONE_ENABLED:true}


