<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Wespresso World — Order Receipt</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; color: #333; }
        h1   { color: #6b3a2a; }
        .receipt-box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .label { font-weight: bold; }
        .message-box { background: #f9f4ef; padding: 12px; border-radius: 4px; margin-top: 16px; }
        .items { width: 100%; border-collapse: collapse; margin: 16px 0; }
        .items td, .items th { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h1>☕ Wespresso World</h1>
    <h2>Order Receipt</h2>

    <div class="receipt-box">

        <p><span class="label">Order ID:</span>
            <span th:text="${order.id}">123</span></p>

        <p><span class="label">Customer:</span>
            <span th:text="${order.customerName}">username</span></p>

        <p><span class="label">Shipping To:</span>
            <span th:text="${order.shippingAddress}">123 Main St</span></p>

        <table class="items">
            <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.itemName}">Espresso</td>
                <td th:text="${item.quantity}">1</td>
                <td th:text="${item.price}">2.50</td>
            </tr>
        </table>

        <p><span class="label">Total:</span>
            $<span th:text="${order.totalPrice}">0.00</span></p>

        <div class="message-box" th:if="${customMessage != null}">
            <span class="label">Your message:</span>
            <!-- SAFE: th:text encodes output as plain text, never evaluates it -->
            <p th:text="${customMessage}">Your message here</p>
        </div>

    </div>
</body>
</html>
