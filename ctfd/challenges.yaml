# CTFd Portable Challenge Import
# Import via: Admin Panel → Import → select this file (as a .zip containing this YAML)
# Or create challenges manually using this as a reference.
#
# Target: Wespresso World — http://<host>:31337  (API: http://<host>:1337/api/v1)

version: "0.1"

challenges:
  - name: "Flat White Access"
    author: "admin"
    category: "Recon"
    description: |
      Every coffee shop has a back office. Wespresso World's API
      has a documentation page that's supposed to be admin-only.

      Find it and retrieve the flag hidden in the response.

      Target: `http://<host>:1337/api/v1`
    value: 50
    type: standard
    flags:
      - flag{swagger_found_the_docs}
    hints:
      - content: "Spring Boot APIs often ship with a standard API documentation library."
        cost: 10
      - content: "Try /api/v1/swagger-ui.html — but you'll need the right role to see it."
        cost: 20
    tags:
      - recon
      - api
    state: visible

  - name: "None Shall Pass"
    author: "admin"
    category: "Web / JWT"
    description: |
      The baristas at Wespresso World use JWT tokens to prove who they are.
      But their token validation has a classic flaw.

      Forge a token that grants you the `admin` role and call a
      protected admin endpoint. The flag is waiting in the admin panel.

      Target API: `http://<host>:1337/api/v1`

      **Hint:** The server accepts a Bearer token with any algorithm it claims.
    value: 300
    type: standard
    flags:
      - flag{jwt_none_alg_pwned}
    hints:
      - content: |
          JWT tokens have three Base64url-encoded parts: header.payload.signature.
          What happens if the header says `"alg": "none"`?
        cost: 50
      - content: |
          Build a header: `{"alg":"none","typ":"JWT"}`
          Build a payload: `{"sub":"admin","role":"admin","userId":1,"username":"admin","email":"admin@wespresso.com","exp":9999999999}`
          Base64url-encode each part, join with dots, and append a trailing dot for the empty signature:
          `<header>.<payload>.`
        cost: 100
    tags:
      - jwt
      - auth-bypass
      - web
    state: visible

  - name: "Double Shot Admin"
    author: "admin"
    category: "Web / Privilege Escalation"
    description: |
      You've forged your way in. Now prove it.

      Using your forged admin JWT, delete a menu item via the API.
      The flag will be returned in the response body.

      `DELETE /api/v1/menu/{id}`
    value: 200
    type: standard
    flags:
      - flag{admin_delete_menu_item}
    hints:
      - content: "You need a valid admin JWT first. Solve 'None Shall Pass' if you haven't already."
        cost: 25
      - content: "Send a DELETE request to /api/v1/menu/1 with your forged token in the Authorization header."
        cost: 50
    tags:
      - jwt
      - privilege-escalation
      - web
    state: visible

  - name: "Cold Brew Enumeration"
    author: "admin"
    category: "Web / IDOR"
    description: |
      Wespresso World lets authenticated users view their own cart.
      But does the server *really* check who the cart belongs to?

      Log in as a regular user, then try to access another user's cart.
      The flag is inside cart ID 1 (the admin's cart).

      `GET /api/v1/cart/1`
    value: 150
    type: standard
    flags:
      - flag{idor_cart_access}
    hints:
      - content: "The cart endpoint checks the JWT's username claim against the cart owner. What if those could be made to match?"
        cost: 50
      - content: "Combine the JWT None technique with knowledge of the cart owner's username to pass the ownership check."
        cost: 75
    tags:
      - idor
      - web
      - jwt
    state: visible

  - name: "Grounds for Concern"
    author: "admin"
    category: "Web / Recon"
    description: |
      The application exposes a database management console that requires
      no authentication in certain configurations.

      Find the console, log in, and run a query to dump the users table.
      Submit the admin's bcrypt password hash as the flag.

      Target: `http://<host>:1337`
    value: 200
    type: standard
    flags:
      - flag{h2_console_db_dump}
    hints:
      - content: "Spring Boot applications sometimes ship with an embedded database console at a well-known path."
        cost: 25
      - content: "Try /api/v1/h2-console. The JDBC URL is in the app's application.properties: jdbc:sqlite:wespresso.db"
        cost: 75
    tags:
      - recon
      - database
      - web
    state: visible

  - name: "The Decaf Protest"
    author: "admin"
    category: "Web / Business Logic"
    description: |
      Someone at Wespresso World forgot to validate a field in the cart API.
      What happens when you add a *negative* quantity of an item?

      Craft a request that results in a cart total below $0.00.
      The flag is the resulting cart total (two decimal places, e.g. `flag{-42.50}`).
    value: 100
    type: standard
    flags:
      - flag{-1.00}
    hints:
      - content: "Try POST /api/v1/cart/{cartId}/add-drink with a negative quantity in the request body."
        cost: 25
      - content: |
          {"drinkId": 1, "quantity": -1}
          Watch what happens to the cart's totalPrice field in the response.
        cost: 50
    tags:
      - business-logic
      - web
    state: visible
